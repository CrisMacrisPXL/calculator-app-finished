name: Build Example3

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code uitchecken
        uses: actions/checkout@v4

      - name: Node.js en npm instellen
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Dependencies installeren
        run: npm install

      - name: Bundelen in een zip
        run: zip -r app.zip . -x ".git/*"

      - name: Unit tests uitvoeren 
        run: npm test -- --ci --coverage

      - name: Better test reports action
        if: always()
        uses: mridang/action-test-reporter@v1.3.0
        with:
          coverage-file: coverage/lcov.info
